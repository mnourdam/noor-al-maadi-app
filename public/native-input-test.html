<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Native HTML Input Test</title>
  </head>
  <body>
    <h1>Native HTML Input Test</h1>
    <p>This page bypasses React, app CSS, routing, providers, splash, and the app shell.</p>
    <label for="native-input">Plain input</label>
    <input id="native-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
    <br><br>
    <label for="native-textarea">Plain textarea</label>
    <textarea id="native-textarea" rows="4" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea>
    <br><br>
    <button type="button" onclick="location.href='/'">Back</button>
    <script>
      (function () {
        var prefix = "[android-native-input-test]";
        function len(target) {
          return target && typeof target.value === "string" ? target.value.length : null;
        }
        function name(target) {
          return target ? ((target.tagName || "node").toLowerCase() + (target.id ? "#" + target.id : "")) : "none";
        }
        function log(eventName, event) {
          try {
            console.info(prefix, eventName, {
              target: name(event && event.target),
              active: name(document.activeElement),
              length: len(event && event.target),
              inputType: event && event.inputType || undefined,
              hidden: document.hidden,
              hasFocus: document.hasFocus && document.hasFocus()
            });
          } catch (_) {}
        }
        console.info(prefix, "mounted", { url: location.href, userAgent: /Android/i.test(navigator.userAgent) ? "Android" : "non-Android" });
        ["focusin", "focusout", "keydown", "beforeinput", "input", "change", "compositionstart", "compositionend"].forEach(function (eventName) {
          document.addEventListener(eventName, function (event) { log(eventName, event); }, true);
        });
        ["focus", "blur", "visibilitychange"].forEach(function (eventName) {
          window.addEventListener(eventName, function (event) { log("window-" + eventName, event); }, true);
        });
      })();
    </script>
  </body>
</html>
