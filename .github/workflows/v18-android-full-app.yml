name: V18 isolated actual Android app acceptance
on:
  push:
    branches: [v18-01a-outbox-recovery]
    paths:
      - '.github/workflows/v18-android-full-app.yml'
      - 'tests/native-app/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-app:
    if: github.ref == 'refs/heads/v18-01a-outbox-recovery'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Initialize sanitized failure evidence
        run: echo '{"result":"FAIL","stage":"toolchain_setup","release_ready":false}' > "$RUNNER_TEMP/irth-full-app-result.json"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Exact official SDK packages, no host acceleration changes
        run: |
          test -f "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-35;default;x86_64' </dev/null
      - name: Locked dependencies and static controls
        run: |
          npm ci --ignore-scripts
          python3 -m venv "$RUNNER_TEMP/irth-native-python"
          "$RUNNER_TEMP/irth-native-python/bin/python" -m pip install websocket-client==1.8.0
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/irth-native-python/bin/python" -m unittest discover -s tests/native-app -p 'test_*.py' -v
          node --test tests/native-app/test-transport.mjs
      - name: Build fresh actual app with synthetic transport and ephemeral signer
        run: '"$RUNNER_TEMP/irth-native-python/bin/python" tests/native-app/build-full-app.py "$RUNNER_TEMP/irth-full-app" --result "$RUNNER_TEMP/irth-full-app-result.json"'
      - name: Installed actual app and native journeys
        run: |
          "$RUNNER_TEMP/irth-native-python/bin/python" tests/native-app/runner.py --apk "$RUNNER_TEMP/irth-full-app/android/app/build/outputs/apk/debug/app-debug.apk" --receipt "$RUNNER_TEMP/irth-full-app/apk-receipt.json" --journeys tests/native-app/journeys.py --result "$RUNNER_TEMP/irth-full-app-result.json"
      - name: Retain sanitized result, including blocked groups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-android-app-result
          path: ${{ runner.temp }}/irth-full-app-result.json
          if-no-files-found: warn
          retention-days: 7
