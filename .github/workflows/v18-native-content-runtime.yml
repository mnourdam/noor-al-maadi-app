name: V18 Disposable Native Content Runtime
on:
  push:
    branches: [v18-01a-outbox-recovery]
    paths:
      - '.github/workflows/v18-native-content-runtime.yml'
      - 'tests/offline/browser/*native-content*'
      - 'tests/offline/browser/content-runtime-fixture.ts'
      - 'android/**'
      - 'src/lib/offline-*'
      - 'src/lib/local-first-store.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-content:
    if: >-
      github.ref == 'refs/heads/v18-01a-outbox-recovery' && github.event_name == 'push' && github.run_number == 7 && github.run_attempt == 1 && github.event.head_commit.message == 'test(v18): one-shot KVM acceptance approved 20261112-01'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install websocket-client==1.8.0
      - name: Verify bounded debug-readiness polling
        run: python tests/offline/browser/native-content-device.py --self-test-readiness
      - name: Provision official tools using existing accepted licenses only
        run: |
          set -euo pipefail
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          test -f "$ANDROID_HOME/licenses/android-sdk-license"
          # Never accept new license terms automatically; stdin is closed.
          "$manager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-35;default;x86_64' </dev/null
          image_metadata="$ANDROID_HOME/system-images/android-35/default/x86_64/package.xml"
          if [[ ! -f "$image_metadata" ]]; then
            echo 'NATIVE_PREFLIGHT_FAIL: AOSP35 package.xml missing'
            exit 1
          fi
          echo 'NATIVE_PREFLIGHT_PASS: AOSP35 package.xml present'
          # Read-only accelerator diagnostics; never alter host permissions.
          set +e
          "$ANDROID_HOME/emulator/emulator" -accel-check
          accel_status=$?
          set -e
          echo "NATIVE_PREFLIGHT_DIAGNOSTIC: emulator accel-check exit=$accel_status"
          kvm_present=false; kvm_readable=false; kvm_writable=false
          [[ ! -e /dev/kvm ]] || kvm_present=true
          [[ ! -r /dev/kvm ]] || kvm_readable=true
          [[ ! -w /dev/kvm ]] || kvm_writable=true
          echo "NATIVE_PREFLIGHT_DIAGNOSTIC: kvm present=$kvm_present readable=$kvm_readable writable=$kvm_writable"
          if [[ "$kvm_present" == true && "$kvm_readable" == true && "$kvm_writable" == true && "$accel_status" == 0 ]]; then
            echo 'NATIVE_ACCEL=on' >> "$GITHUB_ENV"
            echo 'NATIVE_PREFLIGHT_MODE: verified usable KVM; hardware acceleration on'
          else
            echo 'NATIVE_ACCEL=off' >> "$GITHUB_ENV"
            echo 'NATIVE_PREFLIGHT_MODE: software emulation; hardware acceleration off'
          fi
      - name: Prepare disposable app copy and ephemeral debug key
        run: python tests/offline/browser/prepare-native-content.py "$RUNNER_TEMP/irth-native-acceptance"
      - name: Package debug only and verify absence of INTERNET before install
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/irth-native-acceptance/android"
          ./gradlew --no-daemon --console=plain :app:assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          python - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          files=list(pathlib.Path('app/build/intermediates/merged_manifests').rglob('AndroidManifest.xml'))
          assert files, 'Merged manifests missing'
          for file in files:
              permissions=[e.get('{http://schemas.android.com/apk/res/android}name') for e in ET.parse(file).getroot().findall('uses-permission')]
              assert 'android.permission.INTERNET' not in permissions, 'Merged INTERNET forbidden'
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" > "$RUNNER_TEMP/native-permissions.txt"
          if grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/native-permissions.txt"; then echo 'INTERNET permission forbidden'; exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
      - name: Start disposable AOSP emulator and verify native runtime
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/platform-tools/adb"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb version
          # One approved job only; no permission fallback or retry.
          test "$GITHUB_RUN_NUMBER" = 7
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(id -u)" != 0
          test -c /dev/kvm && test ! -L /dev/kvm
          command -v getfacl >/dev/null
          command -v setfacl >/dev/null
          umask 077
          lease="$RUNNER_TEMP/native-kvm-lease"
          test ! -e "$lease"
          mkdir "$lease"
          getfacl -n -p /dev/kvm > "$lease/before.acl"
          stat -Lc '%D:%i:%t:%T' /dev/kvm > "$lease/device.identity"
          export NATIVE_KVM_LEASE="$lease"
          # Refuse an existing restrictive mask: never expand anyone else's rights.
          python - <<'PYACL'
          import os,pathlib
          lines=pathlib.Path(os.environ['NATIVE_KVM_LEASE'],'before.acl').read_text().splitlines()
          entries={':'.join(x.split(':')[:2]):x.split(':')[2] for x in lines if x and not x.startswith('#')}
          mask=entries.get('mask:',entries.get('group:',''))
          assert 'r' in mask and 'w' in mask, 'KVM existing mask cannot support narrow rw grant'
          assert 'user:'+str(os.getuid()) not in entries, 'KVM runner already has named ACL; refuse unreviewed replacement'
          PYACL
          cat > "$lease/restore.sh" <<'SHRESTORE'
          set -euo pipefail
          lease="$RUNNER_TEMP/native-kvm-lease"
          if [[ ! -f "$lease/attempted" ]]; then exit 0; fi
          test -c /dev/kvm && test ! -L /dev/kvm
          test "$(stat -Lc '%D:%i:%t:%T' /dev/kvm)" = "$(cat "$lease/device.identity")"
          sudo -n setfacl --restore="$lease/before.acl"
          getfacl -n -p /dev/kvm > "$lease/after.acl"
          cmp -s "$lease/before.acl" "$lease/after.acl"
          echo 'NATIVE_KVM_RESTORE_VERIFIED'
          SHRESTORE
          cleanup_native() {
            status=$?
            trap - EXIT
            timeout 10 adb emu kill >/dev/null 2>&1 || true
            if ! bash "$lease/restore.sh"; then echo 'NATIVE_KVM_RESTORE_FAILED'; status=1; fi
            exit "$status"
          }
          trap cleanup_native EXIT
          touch "$lease/attempted"
          sudo -n setfacl -n -m "u:$(id -u):rw" /dev/kvm
          getfacl -n -p /dev/kvm > "$lease/granted.acl"
          python - <<'PYACL'
          import os,pathlib
          root=pathlib.Path(os.environ['NATIVE_KVM_LEASE'])
          def entries(name):
              return {':'.join(x.split(':')[:2]):x.split(':')[2] for x in (root/name).read_text().splitlines() if x and not x.startswith('#')}
          before=entries('before.acl');expected=dict(before)
          expected['user:'+str(os.getuid())]='rw-'
          expected.setdefault('mask:',before['group:'])
          assert entries('granted.acl')==expected, 'KVM ACL expanded beyond approved current user'
          PYACL
          test "$(stat -Lc '%D:%i:%t:%T' /dev/kvm)" = "$(cat "$lease/device.identity")"
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          export NATIVE_ACCEL=on
          echo 'NATIVE_KVM_CURRENT_USER_GRANT_VERIFIED'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/native-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          # 'no' declines optional custom hardware profile; this is not license consent.
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n irth-acceptance -k 'system-images;android-35;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd irth-acceptance -accel "$NATIVE_ACCEL" -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/native-emulator.log" 2>&1 &
          timeout 300 adb wait-for-device
          for i in $(seq 1 300); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          mapfile -t devices < <(adb devices | awk '$2=="device" {print $1}')
          test "${#devices[@]}" = 1
          [[ "${devices[0]}" =~ ^emulator-[0-9]+$ ]]
          export ANDROID_SERIAL="${devices[0]}"
          adb install "$RUNNER_TEMP/irth-native-acceptance/android/app/build/outputs/apk/debug/app-debug.apk"
          python tests/offline/browser/native-content-device.py > native-content-result.json
          cat native-content-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-content-sanitized-evidence
          path: native-content-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify restoration of the one-shot KVM ACL
        if: always()
        run: |
          set -euo pipefail
          lease="$RUNNER_TEMP/native-kvm-lease"
          if [[ -f "$lease/attempted" ]]; then
            test -f "$lease/restore.sh"
            bash "$lease/restore.sh"
          else
            echo 'NATIVE_KVM_NOT_MODIFIED'
          fi
      - name: Discard isolated app, key and emulator data
        if: always()
        run: rm -rf "$RUNNER_TEMP/irth-native-acceptance" "$RUNNER_TEMP/native-avd"
