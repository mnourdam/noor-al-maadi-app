name: V18 Network Emulation Diagnostic
on:
  push:
    branches: [v18-01a-outbox-recovery]
    paths:
      - '.github/workflows/v18-network-emulation-diagnostic.yml'
      - 'tests/offline/browser/network-emulation-diagnostic.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/v18-01a-outbox-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official Chromium tooling
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Compare synthetic network emulation (not app acceptance)
        run: python tests/offline/browser/network-emulation-diagnostic.py | tee network-emulation-diagnostic.json
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-emulation-diagnostic
          path: network-emulation-diagnostic.json
          retention-days: 7
