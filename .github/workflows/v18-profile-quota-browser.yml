name: V18 Profile Quota Browser Acceptance
on:
  push:
    branches: [v18-01a-outbox-recovery]
    paths:
      - '.github/workflows/v18-profile-quota-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-quota:
    if: github.ref == 'refs/heads/v18-01a-outbox-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/offline/browser/test-profile-quota-build.mjs
      - run: python tests/offline/browser/test-profile-quota-safety.py
      - name: Install official pinned browser tooling
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Synthetic actual profile quota browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          export CHROMIUM_EXECUTABLE_PATH="$(python -c 'from playwright.sync_api import sync_playwright; exec("with sync_playwright() as p:\n print(p.chromium.executable_path)")')"
          status=0
          python tests/offline/browser/profile-quota-browser.py > profile-quota-result.json || status=$?
          cat profile-quota-result.json
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('profile-quota-result.json') != ''
        with:
          name: profile-quota-browser-evidence
          path: profile-quota-result.json
          if-no-files-found: error
          retention-days: 7
