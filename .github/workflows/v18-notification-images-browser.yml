name: V18 Notification Images Browser Acceptance
on:
  push:
    branches: [v18-01a-outbox-recovery]
    paths:
      - '.github/workflows/v18-notification-images-browser.yml'
      - 'tests/offline/browser/*notification-images*'
      - 'src/components/notifications/NotificationThumbnail.tsx'
      - 'src/components/CachedImage.tsx'
      - 'src/lib/image-cache.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notification-images:
    if: github.ref == 'refs/heads/v18-01a-outbox-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/offline/browser/test-notification-images-build.mjs
      - name: Install official pinned browser tooling
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Synthetic thumbnail browser comparison
        shell: bash
        run: |
          set -euo pipefail
          export CHROMIUM_EXECUTABLE_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/offline/browser/notification-images-browser.py > notification-images-result.json
          cat notification-images-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: notification-images-browser-evidence
          path: notification-images-result.json
          if-no-files-found: error
          retention-days: 7
