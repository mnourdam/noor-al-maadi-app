name: V18 Bundled Image Browser Decode
on:
  push:
    branches: [v18-01a-outbox-recovery]
    paths:
      - '.github/workflows/v18-image-decode-browser.yml'
      - 'tests/offline/browser/*image-decode*'
      - 'src/lib/image-cache.*'
      - 'src/lib/stories/media/**'
      - 'src/lib/campaign-art/**'
      - 'public/story-media/**'
      - 'public/campaign-key-art/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-decode:
    if: github.ref == 'refs/heads/v18-01a-outbox-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/offline/browser/test-image-decode-build.mjs
      - name: Install official pinned browser tooling
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Bundled image decode acceptance
        shell: bash
        run: |
          set -euo pipefail
          export CHROMIUM_EXECUTABLE_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/offline/browser/image-decode-browser.py > image-decode-result.json
          cat image-decode-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-decode-browser-evidence
          path: image-decode-result.json
          if-no-files-found: error
          retention-days: 7
