name: V18 Profile Achievement Browser Acceptance
on:
  push:
    branches: [v18-01a-outbox-recovery]
    paths:
      - '.github/workflows/v18-profile-achievement-browser.yml'
      - 'tests/offline/browser/*profile-achievement*'
      - 'src/routes/profile.tsx'
      - 'src/lib/achievements/v2/**'
      - 'src/lib/ui-language/**'
      - 'src/components/ModalPortal.tsx'
      - 'src/components/AppShell.tsx'
      - 'src/styles.css'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-achievement:
    if: github.ref == 'refs/heads/v18-01a-outbox-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/offline/browser/test-profile-achievement-build.mjs
      - run: python tests/offline/browser/test-profile-achievement-safety.py
      - name: Install official pinned browser tooling
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Synthetic actual Profile achievement browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          export CHROMIUM_EXECUTABLE_PATH="$(python -c 'from playwright.sync_api import sync_playwright; exec("with sync_playwright() as p:\n print(p.chromium.executable_path)")')"
          status=0
          python tests/offline/browser/profile-achievement-browser.py > profile-achievement-result.json || status=$?
          cat profile-achievement-result.json
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('profile-achievement-result.json') != ''
        with:
          name: profile-achievement-browser-evidence
          path: profile-achievement-result.json
          if-no-files-found: error
          retention-days: 7
