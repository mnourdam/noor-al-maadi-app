name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/android --save

      - name: Prepare Android web assets
        run: |
          mkdir -p dist/android
          cat > dist/android/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>إرث</title>
              <script>
                window.location.replace("https://noraty-arabiya.lovable.app/");
              </script>
            </head>
            <body></body>
          </html>
          EOF

      - name: Add Capacitor Android platform
        run: npx -y @capacitor/cli add android

      - name: Sync Capacitor Android project
        run: npx -y @capacitor/cli sync android

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle <<'EOF'

          subprojects {
              configurations.configureEach {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
