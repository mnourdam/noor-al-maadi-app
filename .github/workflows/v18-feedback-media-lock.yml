name: V18 Storage Completion Lock Observation
on:
  push:
    branches: [v18-01a-outbox-recovery]
    paths:
      - '.github/workflows/v18-feedback-media-lock.yml'
      - 'tests/sql/feedback-media-lock/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-authority-http:
    if: github.ref == 'refs/heads/v18-01a-outbox-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # official v3.2.0
        with:
          version: '2.122.1'
      - name: Fail-closed harness and adapter tests without a stack
        run: python3 -m unittest discover -s tests/sql/feedback-media-lock -p 'test_*.py' -v
      - name: Bounded synthetic completion-lock observation
        run: python3 tests/sql/feedback-media-lock/experiment.py run
      - name: Cleanup this run project only without backups
        if: always()
        run: python3 tests/sql/feedback-media-lock/experiment.py cleanup
      - name: Upload sanitized report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-media-lock-evidence
          path: ${{ runner.temp }}/v18-feedback-media-lock/acceptance.json
          if-no-files-found: warn
          retention-days: 7
