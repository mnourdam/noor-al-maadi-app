<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="إرث هو عالم تاريخي تفاعلي يتيح استكشاف تاريخ المسلمين عبر الشخصيات والدول والمعارك والمدن والأحداث في تجربة معرفية غامرة." />
    <meta name="theme-color" content="#0b1424" />
    <meta name="application-name" content="إرث" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Capacitor input diagnostic: when the APK opens /android-input-test,
      // stop the Irth app bundle before it mounts and replace the document with
      // plain HTML controls. Capacitor's own WebView/bridge still exists, but
      // React, app CSS, push setup, back handlers, splash JS, and custom app
      // listeners are not loaded on this route.
      (function () {
        try {
          var path = window.location.pathname || "";
          if (path !== "/android-input-test" && !path.endsWith("/android-input-test")) return;
          window.__irthAndroidInputTest = true;
          window.__irthCapacitorMinimalMode = true;
          var html = "<!doctype html><html><head>" +
            "<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>" +
            "<title>Capacitor Plain Input Test</title>" +
            "<style>html,body{margin:0;background:#fff;color:#111;font:16px system-ui,sans-serif}main{box-sizing:border-box;min-height:100vh;padding:24px 18px 48px}label{display:block;font-weight:700;font-size:13px;margin:18px 0 8px}input,textarea,button{box-sizing:border-box;width:100%;font:16px system-ui,sans-serif;padding:12px;border:1px solid #999;border-radius:6px;background:#fff;color:#111}button{margin-top:16px;background:#eee;font-weight:700}</style>" +
            "</head><body><main>" +
            "<h1>Capacitor Plain Input Test</h1>" +
            "<p>Same Capacitor WebView, minimal native plugins, no React, no app CSS, no Irth bundle.</p>" +
            "<label for='cap-plain-input'>Plain input</label><input id='cap-plain-input' type='text' autocomplete='off' autocapitalize='none' spellcheck='false'>" +
            "<label for='cap-plain-textarea'>Plain textarea</label><textarea id='cap-plain-textarea' rows='4' autocomplete='off' autocapitalize='none' spellcheck='false'></textarea>" +
            "<button type='button' onclick='try{IrthNativeDiagnostics.openBareInputTest()}catch(e){console.info(\"[android:cap-min] raw activity unavailable\",e&&e.message)}'>Open raw Android WebView input test</button>" +
            "<button type='button' onclick='location.href=\"/\"'>Back to app</button>" +
            "</main><script>(function(){var p=\"[android:cap-min-input]\";function tag(el){return el?((el.tagName||\"node\").toLowerCase()+(el.id?\"#\"+el.id:\"\")):\"none\"}function len(el){return el&&typeof el.value===\"string\"?el.value.length:null}function log(n,e){try{console.info(p,n,{target:tag(e&&e.target),active:tag(document.activeElement),length:len(e&&e.target),inputType:e&&e.inputType||undefined,hidden:document.hidden,hasFocus:document.hasFocus&&document.hasFocus()})}catch(_){}}console.info(p,\"mounted\",{url:location.href});[\"focusin\",\"focusout\",\"keydown\",\"beforeinput\",\"input\",\"change\",\"compositionstart\",\"compositionend\"].forEach(function(n){document.addEventListener(n,function(e){log(n,e)},true)});})();<\/script>" +
            "</body></html>";
          document.open();
          document.write(html);
          document.close();
        } catch (e) {
          console.error("[android:cap-min] plain html bootstrap failed", e);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="./irth-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" />
    <title>إرث — رحلة عبر التاريخ الإسلامي</title>
    <style>
      :root {
        --safe-area-inset-top: 0px;
        --safe-area-inset-right: 0px;
        --safe-area-inset-bottom: 0px;
        --safe-area-inset-left: 0px;
      }
      /* Hide React tree until the cinematic splash is ready to take over.
         Without this, the home page can briefly paint between the native
         launch screen and the JS splash on slow cold-starts (App UI → black
         → Splash → App). */
      html.irth-booting #root { visibility: hidden; }
      html.android-input-test-boot #root { visibility: visible !important; }
      html.android-input-test-boot #irth-boot-splash { display: none !important; }
      #irth-boot-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        background:
          radial-gradient(circle at 50% 50%,
            rgba(212,175,90,0.28) 0%,
            rgba(212,175,90,0.08) 28%,
            rgba(5,8,15,0) 62%),
          #05080f;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 280ms ease-out;
      }
      #irth-boot-splash.is-out { opacity: 0; }
      #irth-boot-splash img {
        width: 96px; height: 96px;
        filter: drop-shadow(0 0 22px rgba(212,175,90,0.5));
        animation: irth-boot-pulse 2.2s ease-in-out infinite;
      }
      @keyframes irth-boot-pulse {
        0%,100% { opacity: 0.85; transform: scale(1); }
        50%     { opacity: 1;    transform: scale(1.05); }
      }
    </style>
    <script>
      // Capacitor's SystemBars plugin injects:
      //   document.documentElement.style.setProperty("--safe-area-inset-*", ...)
      // It can fire before <html> is fully attached on some Android WebView
      // versions, producing: "Cannot read properties of null (reading 'style')".
      // The Capacitor catch handler already swallows the throw, but we also
      // make sure stray errors never bubble up and block React mount.
      (function () {
        try {
          if (window.location.pathname === "/android-input-test" || window.location.pathname.endsWith("/android-input-test")) {
            document.documentElement.classList.add("android-input-test-boot");
            window.__irthAndroidInputTest = true;
            console.info("[android-input-test] boot html isolation path detected");
          }
        } catch (_) {}
        window.addEventListener("error", function (e) {
          if (e && e.message && /safe area/i.test(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        });
        // Defensive shim: if some early call hits document.documentElement
        // before the parser attached <html>, return a no-op style target.
        try {
          var realDesc = Object.getOwnPropertyDescriptor(
            Document.prototype,
            "documentElement"
          );
          if (realDesc && realDesc.get) {
            var noop = { setProperty: function () {}, removeProperty: function () {} };
            Object.defineProperty(Document.prototype, "documentElement", {
              configurable: true,
              get: function () {
                var el = realDesc.get.call(this);
                return el || { style: noop };
              },
            });
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <script>
      // Mark the document as booting so #root stays invisible until the JS
      // splash mounts and removes the boot overlay.
      if (!document.documentElement.classList.contains("android-input-test-boot")) {
        document.documentElement.classList.add("irth-booting");
      }
    </script>
    <div id="irth-boot-splash">
      <img src="./irth-icon.png" alt="" aria-hidden="true" />
    </div>
    <div id="root"></div>
    <script>
      // Safety net: never let the boot overlay stay forever if the JS splash
      // fails to mount. After 8s, fade it out and reveal #root.
      if (document.documentElement.classList.contains("android-input-test-boot")) {
        try {
          var testSplash = document.getElementById("irth-boot-splash");
          testSplash && testSplash.parentNode && testSplash.parentNode.removeChild(testSplash);
          document.documentElement.classList.remove("irth-booting");
        } catch (_) {}
      } else {
        window.setTimeout(function () {
          var el = document.getElementById("irth-boot-splash");
          if (!el) return;
          el.classList.add("is-out");
          document.documentElement.classList.remove("irth-booting");
          window.setTimeout(function () { try { el.parentNode && el.parentNode.removeChild(el); } catch (_) {} }, 320);
        }, 8000);
        // Observe removal: as soon as React's SplashSequence removes the boot
        // overlay, also drop the booting class so #root becomes visible.
        var mo = new MutationObserver(function () {
          if (!document.getElementById("irth-boot-splash")) {
            document.documentElement.classList.remove("irth-booting");
            mo.disconnect();
          }
        });
        mo.observe(document.body, { childList: true });
      }
    </script>
    <script type="module" src="../src/android-client.tsx"></script>
  </body>
</html>
