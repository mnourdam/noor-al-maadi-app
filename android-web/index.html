<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="إرث هو عالم تاريخي تفاعلي يتيح استكشاف تاريخ المسلمين عبر الشخصيات والدول والمعارك والمدن والأحداث في تجربة معرفية غامرة." />
    <meta name="theme-color" content="#0b1424" />
    <meta name="application-name" content="إرث" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Capacitor plain-input diagnostic is now a standalone static page at
         /native-input-test.html. We no longer document.write() over the app
         shell on /android-input-test — that broke "Back to app" and rendered
         malformed concatenation strings. The React-based
         /android-input-test route still hosts the bisection harness. -->

    <link rel="icon" type="image/png" href="./irth-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" />
    <title>إرث — رحلة عبر التاريخ الإسلامي</title>
    <style>
      :root {
        --safe-area-inset-top: 0px;
        --safe-area-inset-right: 0px;
        --safe-area-inset-bottom: 0px;
        --safe-area-inset-left: 0px;
      }
      /* Hide React tree until the cinematic splash is ready to take over.
         Without this, the home page can briefly paint between the native
         launch screen and the JS splash on slow cold-starts (App UI → black
         → Splash → App). */
      html.irth-booting #root { visibility: hidden; }
      html.android-input-test-boot #root { visibility: visible !important; }
      html.android-input-test-boot #irth-boot-splash { display: none !important; }
      #irth-boot-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        background: #00FF00;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 280ms ease-out;
      }
      #irth-boot-splash.is-out { opacity: 0; }
      #irth-boot-splash .boot-test-label {
        font-family: sans-serif;
        font-size: 72px;
        font-weight: 900;
        color: #000000;
        letter-spacing: 4px;
      }

    </style>
    <script>
      // Capacitor's SystemBars plugin injects:
      //   document.documentElement.style.setProperty("--safe-area-inset-*", ...)
      // It can fire before <html> is fully attached on some Android WebView
      // versions, producing: "Cannot read properties of null (reading 'style')".
      // The Capacitor catch handler already swallows the throw, but we also
      // make sure stray errors never bubble up and block React mount.
      (function () {
        try {
          if (window.IrthNativeDiagnostics && window.IrthNativeDiagnostics.getFocusABFlagsJson) {
            var abRaw = window.IrthNativeDiagnostics.getFocusABFlagsJson();
            var abFlags = JSON.parse(abRaw || "{}");
            var abSource = window.IrthNativeDiagnostics.getFocusABFlagsSource ? window.IrthNativeDiagnostics.getFocusABFlagsSource() : "native";
            window.__IRTH_ANDROID_NATIVE_AB_FLAGS__ = abFlags;
            window.__IRTH_ANDROID_NATIVE_AB_SOURCE__ = abSource;
            try { window.localStorage.setItem("irth:android-focus-ab-native", JSON.stringify(abFlags)); } catch (_) {}
            try { window.localStorage.setItem("irth:android-focus-ab-native-source", abSource); } catch (_) {}
            var abLine = window.IrthNativeDiagnostics.getFocusABFlagsLine && window.IrthNativeDiagnostics.getFocusABFlagsLine();
            if (abLine) console.info("IRTH_AB_FLAGS " + abLine);
          }
        } catch (_) {}
        try {
          if (window.location.pathname === "/android-input-test" || window.location.pathname.endsWith("/android-input-test")) {
            document.documentElement.classList.add("android-input-test-boot");
            window.__irthAndroidInputTest = true;
            console.info("[android-input-test] boot html isolation path detected");
          }
        } catch (_) {}
        window.addEventListener("error", function (e) {
          if (e && e.message && /safe area/i.test(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        });
        // Defensive shim: if some early call hits document.documentElement
        // before the parser attached <html>, return a no-op style target.
        try {
          var realDesc = Object.getOwnPropertyDescriptor(
            Document.prototype,
            "documentElement"
          );
          if (realDesc && realDesc.get) {
            var noop = { setProperty: function () {}, removeProperty: function () {} };
            Object.defineProperty(Document.prototype, "documentElement", {
              configurable: true,
              get: function () {
                var el = realDesc.get.call(this);
                return el || { style: noop };
              },
            });
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <script>
      // Mark the document as booting so #root stays invisible until the JS
      // splash mounts and removes the boot overlay.
      if (!document.documentElement.classList.contains("android-input-test-boot")) {
        document.documentElement.classList.add("irth-booting");
      }
    </script>
    <div id="irth-boot-splash">
      <div class="boot-test-label">BOOT TEST</div>
    </div>

    <div id="root"></div>
    <script>
      // Safety net: never let the boot overlay stay forever if the JS splash
      // fails to mount. After 8s, fade it out and reveal #root.
      if (document.documentElement.classList.contains("android-input-test-boot")) {
        try {
          var testSplash = document.getElementById("irth-boot-splash");
          testSplash && testSplash.parentNode && testSplash.parentNode.removeChild(testSplash);
          document.documentElement.classList.remove("irth-booting");
        } catch (_) {}
      } else {
        window.setTimeout(function () {
          var el = document.getElementById("irth-boot-splash");
          if (!el) return;
          el.classList.add("is-out");
          document.documentElement.classList.remove("irth-booting");
          window.setTimeout(function () { try { el.parentNode && el.parentNode.removeChild(el); } catch (_) {} }, 320);
        }, 8000);
        // Observe removal: as soon as React's SplashSequence removes the boot
        // overlay, also drop the booting class so #root becomes visible.
        var mo = new MutationObserver(function () {
          if (!document.getElementById("irth-boot-splash")) {
            document.documentElement.classList.remove("irth-booting");
            mo.disconnect();
          }
        });
        mo.observe(document.body, { childList: true });
      }
    </script>
    <script type="module" src="../src/android-client.tsx"></script>
  </body>
</html>
